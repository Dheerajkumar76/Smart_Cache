<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Replay explorer: SmartCache</title>
  <link rel="stylesheet" href="/static/site.css">
  <style>
    .playback { display: flex; gap: 16px; align-items: center; flex-wrap: wrap; margin-top: 18px; padding-top: 18px; border-top: 1px solid var(--rule); }
    .scrubber { flex: 1 1 260px; display: grid; gap: 4px; }
    .scrubber input { width: 100%; accent-color: var(--ink); }
    .scrubber span { font-size: 14px; color: var(--muted); }
    .filters { display: flex; flex-wrap: wrap; gap: 10px 22px; margin: 20px 0 6px; }
    .family { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
    .family b { font-size: 14px; font-weight: 600; color: var(--muted); margin-right: 2px; }
    .chip { display: inline-flex; gap: 6px; align-items: center; padding: 5px 11px; border: 1px solid var(--rule-strong); border-radius: 99px; background: var(--surface); font-size: 14px; cursor: pointer; user-select: none; }
    .chip:has(input:checked) { border-color: var(--ink); }
    .chip input { margin: 0; accent-color: var(--ink); }
    .grid { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.25fr); gap: 16px; margin-top: 16px; align-items: start; }
    .request-line { font-size: 15px; color: var(--muted); margin: 4px 0 16px; }
    .request-line b { color: var(--ink); font-size: 18px; }
    .decision { padding: 12px 14px; background: var(--paper); border-radius: 8px; margin: 8px 0 18px; }
    .decision p { margin: 8px 0 0; }
    .slots { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
    .slot { font-size: 13px; padding: 4px 9px; border: 1px solid var(--rule-strong); border-radius: 6px; background: var(--surface); }
    .slot.new { border-color: var(--hit); background: var(--hit-soft); }
    .best { color: var(--hit); font-weight: 700; }
    tr.is-focus td { background: var(--paper); }
    .empty-state { padding: 36px 20px; text-align: center; color: var(--muted); }
    @media (max-width: 900px) { .grid { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
<header id="site-header"></header>
<main class="page">
  <div class="page-head">
    <h1>Replay explorer</h1>
    <p class="lead">Replay one request stream through every eviction policy and follow each decision: what was a hit, what was evicted, and what the misses cost.</p>
  </div>

  <section class="panel" aria-label="Replay settings">
    <div class="controls">
      <label class="field">Workload<select id="workload"><option value="chatbot">AI chatbot (5,000 questions)</option><option value="demo">Original demo (7 objects)</option></select></label>
      <label class="field">Traffic<select id="scenario"><option value="stationary">Steady topics</option><option value="drifting">Topics change</option></select></label>
      <label class="field">Seed<input id="seed" type="number" value="2026"></label>
      <label class="field">Questions<input id="count" type="number" min="1" max="1000" value="1000"></label>
      <label class="field">Cache size<input id="capacity" type="number" min="1" value="50"></label>
      <button class="btn btn-primary" id="load" type="button">Run replay</button>
    </div>
    <div class="playback">
      <div class="btn-group">
        <button class="btn" id="prev" type="button" disabled>Previous</button>
        <button class="btn" id="play" type="button" disabled>Play</button>
        <button class="btn" id="next" type="button" disabled>Next</button>
      </div>
      <label class="scrubber"><span id="position">No replay yet</span><input id="scrub" type="range" min="0" max="0" value="0" disabled aria-label="Request number"></label>
      <label class="field">Follow policy<select id="focus" disabled><option>—</option></select></label>
    </div>
  </section>

  <div id="filters" class="filters"></div>
  <div id="notice" class="notice"></div>

  <div id="content">
    <div class="panel empty-state">Choose settings and run a replay to compare policies request by request.</div>
  </div>
</main>
<footer id="site-footer"></footer>
<script src="/static/site.js"></script>
<script>
SC.init('explorer');
const $ = id => document.getElementById(id);
const esc = SC.esc;
let data = null, index = 0, timer = null, focusName = null;
const hidden = new Set();
const FAMILY_ORDER = ['Learned (ours)', 'Modern baseline', 'Classical', 'Cost-aware heuristic', 'Contextual bandit', 'Deep RL', 'Other'];
// Defaults per workload: [questions, max questions, cache size].
const WORKLOAD_DEFAULTS = {chatbot: [1000, 1000, 50], demo: [30, 200, 3]};
const LEARNED_FIXED_SLOT = ['DQN', 'DuelingDQN', 'PPO'];

function shortList(keys, limit = 5) {
  if (!keys.length) return '—';
  const shown = keys.slice(0, limit).map(esc).join(', ');
  return keys.length > limit ? `${shown} and ${keys.length - limit} more` : shown;
}
const seconds = ms => `${SC.num(ms / 1000, 1)} s`;

async function load() {
  stop();
  const q = new URLSearchParams({workload: $('workload').value, scenario: $('scenario').value, seed: $('seed').value, requests: $('count').value, capacity: $('capacity').value});
  $('load').disabled = true;
  $('load').textContent = 'Running…';
  try {
    const response = await fetch('/simulation?' + q);
    if (!response.ok) throw new Error((await response.json()).detail || response.statusText);
    data = await response.json();
    index = 0;
    ['prev', 'next', 'play', 'scrub', 'focus'].forEach(id => $(id).disabled = false);
    $('scrub').max = data.requests.length - 1;
    buildLayout();
    buildControls();
    render();
  } catch (error) {
    $('content').innerHTML = `<div class="error-box">The replay could not run: ${esc(error.message)}</div>`;
  } finally {
    $('load').disabled = false;
    $('load').textContent = 'Run replay';
  }
}

function buildLayout() {
  $('content').innerHTML = `
    <div class="grid">
      <section class="panel" aria-labelledby="focus-title">
        <h2 id="focus-title">Following <span id="focus-name"></span></h2>
        <p class="request-line" id="request"></p>
        <div class="ribbon" id="focus-ribbon" role="img" aria-label="Hits and misses so far for the followed policy"></div>
        <div class="decision" id="decision"></div>
        <h3>Cache after this request</h3>
        <div class="slots" id="cache"></div>
      </section>
      <section class="panel" aria-labelledby="compare-title">
        <h2 id="compare-title">This request, every policy</h2>
        <div class="table-wrap"><table id="comparison"></table></div>
      </section>
    </div>
    <section class="panel" style="margin-top: 16px" aria-labelledby="totals-title">
      <div class="section-head"><h2 id="totals-title">Running totals</h2><p id="totals-note"></p></div>
      <div class="table-wrap"><table id="summary"></table></div>
    </section>`;
}

function buildControls() {
  const names = data.policies.map(p => p.policy);
  if (!focusName || !names.includes(focusName)) focusName = ['LearnedValue', 'S3-FIFO'].find(n => names.includes(n)) || names[0];
  $('focus').innerHTML = names.map(n => `<option ${n === focusName ? 'selected' : ''}>${esc(n)}</option>`).join('');
  const groups = {};
  data.policies.forEach(p => (groups[p.family] = groups[p.family] || []).push(p.policy));
  $('filters').innerHTML = FAMILY_ORDER.filter(f => groups[f]).map(f =>
    `<div class="family"><b>${esc(f)}</b>${groups[f].map(n =>
      `<label class="chip"><input type="checkbox" data-policy="${esc(n)}" ${hidden.has(n) ? '' : 'checked'}>${esc(n)}</label>`).join('')}</div>`).join('');
  $('filters').querySelectorAll('input').forEach(box => box.onchange = () => {
    box.checked ? hidden.delete(box.dataset.policy) : hidden.add(box.dataset.policy);
    render();
  });
  const missing = LEARNED_FIXED_SLOT.filter(n => !names.includes(n));
  $('notice').textContent = missing.length
    ? `${missing.join(', ')} are not shown: those older models only work with a cache of 3, and this replay uses ${data.capacity}.`
    : '';
}

function render() {
  const all = data.policies.map(p => ({policy: p.policy, family: p.family, steps: p.steps, step: p.steps[index]}));
  const shown = all.filter(r => !hidden.has(r.policy));
  const req = all[0].step.request;
  const total = data.requests.length;
  $('scrub').value = index;
  $('position').textContent = `Question ${index + 1} of ${total}`;

  const focus = all.find(r => r.policy === focusName) || all[0];
  $('focus-name').textContent = focus.policy === 'LearnedValue' ? 'LearnedValue (ours)' : focus.policy;
  $('request').innerHTML = `<b>${esc(req.key)}</b> takes ${SC.num(req.cost / 1000, 2)} s to answer without the cache`;
  SC.ribbon($('focus-ribbon'), focus.steps.map(s => s.result),
    {cols: Math.min(50, total), upto: index + 1, current: index});
  const hit = focus.step.result === 'HIT';
  $('decision').innerHTML = `<span class="result ${hit ? 'result-hit' : 'result-miss'}">${hit ? 'Hit' : 'Miss'}</span>
    <p>${hit ? 'Already cached, so the AI was not called.'
      : focus.step.evicted ? `Sent to the AI. To make room, ${esc(focus.policy)} evicted <b>${esc(focus.step.evicted)}</b>.`
      : 'Sent to the AI. The cache still had a free slot, so nothing was evicted.'}</p>`;
  const slots = focus.step.after_cache;
  $('cache').innerHTML = slots.length
    ? slots.slice(0, 40).map(key => `<span class="slot${key === req.key && !hit ? ' new' : ''}">${esc(key)}</span>`).join('')
      + (slots.length > 40 ? `<span class="muted small">and ${slots.length - 40} more</span>` : '')
    : '<span class="muted">The cache is empty.</span>';

  if (!shown.length) {
    $('comparison').innerHTML = $('summary').innerHTML =
      '<tr><td class="muted">Every policy is hidden. Tick a policy above to show it.</td></tr>';
    return;
  }
  const rowClass = name => [name === focus.policy ? 'is-focus' : '', name === 'LearnedValue' ? 'is-ours' : ''].join(' ').trim();
  $('comparison').innerHTML = `<thead><tr><th>Policy</th><th>Result</th><th>Evicted</th><th>Cache now holds</th></tr></thead><tbody>${shown.map(r => `
    <tr class="${rowClass(r.policy)}"><td>${esc(r.policy)}</td>
    <td><span class="result ${r.step.result === 'HIT' ? 'result-hit' : 'result-miss'}">${r.step.result === 'HIT' ? 'Hit' : 'Miss'}</span></td>
    <td>${esc(r.step.evicted || '—')}</td><td class="small muted">${shortList(r.step.after_cache)}</td></tr>`).join('')}</tbody>`;

  // Totals up to the current question, so they move with playback.
  const lruRow = all.find(r => r.policy === 'LRU');
  const lruCost = lruRow ? lruRow.steps[index].cumulative_miss_cost_ms : null;
  const totals = shown.map(r => {
    const upto = r.steps.slice(0, index + 1);
    return {policy: r.policy, family: r.family, hits: upto.filter(s => s.result === 'HIT').length,
            cost: r.steps[index].cumulative_miss_cost_ms, decide: upto.reduce((a, s) => a + s.policy_time_ms, 0)};
  }).sort((a, b) => a.cost - b.cost);
  const best = totals[0].cost;
  $('totals-note').textContent = `After ${index + 1} questions, lowest AI time first.`;
  $('summary').innerHTML = `<thead><tr><th>Policy</th><th>Type</th><th class="num">From cache</th><th class="num">AI time on misses</th><th class="num">AI time vs LRU</th><th class="num">Decision time</th></tr></thead><tbody>${totals.map(t => {
    const vs = lruCost ? (lruCost - t.cost) / lruCost * 100 : null;
    return `<tr class="${rowClass(t.policy)}"><td class="${t.cost === best ? 'best' : ''}">${esc(t.policy)}${t.cost === best ? ' (lowest)' : ''}</td>
      <td><span class="tag${t.family === 'Learned (ours)' ? ' tag-ours' : ''}" style="margin-left:0">${esc(t.family)}</span></td>
      <td class="num">${SC.num(t.hits / (index + 1) * 100, 1)}%</td><td class="num">${seconds(t.cost)}</td>
      <td class="num ${vs > 0 ? 'pos' : vs < 0 ? 'neg' : ''}">${vs === null ? '—' : vs === 0 ? '0%' : `${vs > 0 ? '' : '+'}${SC.num(-vs, 1)}%`}</td>
      <td class="num">${SC.num(t.decide, 1)} ms</td></tr>`;
  }).join('')}</tbody>`;
}

function move(delta) {
  if (!data) return;
  index = Math.max(0, Math.min(data.requests.length - 1, index + delta));
  render();
}
function stop() { clearInterval(timer); timer = null; $('play').textContent = 'Play'; }

$('load').onclick = load;
$('prev').onclick = () => { stop(); move(-1); };
$('next').onclick = () => { stop(); move(1); };
$('scrub').oninput = () => { stop(); index = Number($('scrub').value); render(); };
$('focus').onchange = () => { focusName = $('focus').value; render(); };
$('workload').onchange = () => {
  const [count, max, capacity] = WORKLOAD_DEFAULTS[$('workload').value];
  $('count').value = count; $('count').max = max; $('capacity').value = capacity;
};
$('play').onclick = () => {
  if (timer) { stop(); return; }
  $('play').textContent = 'Pause';
  const step = data.requests.length > 300 ? 5 : 1;
  timer = setInterval(() => {
    if (index >= data.requests.length - 1) stop(); else move(step);
  }, 120);
};
</script>
</body>
</html>
